name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig src tests examples
      - run: zig build
      - run: zig build test-all
      - run: zig build test-all -Doptimize=safe
      - run: zig build test-labs
      - run: zig build test-labs -Doptimize=safe
      - run: sh scripts/test/build_args_smoke.sh
      - name: Verify explicit allocator comparators in both modes
        run: |
          for mode in debug safe; do
            zig build test-allocators -Doptimize="$mode"
            zig build test-allocators -Doptimize="$mode" -Dallocator=smp
            zig build test-allocators -Doptimize="$mode" -Dallocator=debug -Dlink-libc=true
            zig build test-allocators -Doptimize="$mode" -Dallocator=smp -Dlink-libc=true
            zig build test-allocators -Doptimize="$mode" -Dallocator=libc
          done
      - name: Verify request arena lifetime and reset policies
        run: |
          for mode in debug safe; do
            for retain in 0 1048576; do
              zig build test-all test-allocators -Doptimize="$mode" -Dallocator=smp -Drequest-arena-retain="$retain"
            done
          done
      - run: for script in scripts/interop/*.sh scripts/bench_port_vs_zbeam.sh; do sh -n "$script"; done

  otp-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["25", "26", "27"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - run: zig build
      - name: Verify OTP ${{ matrix.otp }} MVP contracts
        run: |
          export OTP_ERL_${{ matrix.otp }}="$(command -v erl)"
          export OTP_VERSIONS="${{ matrix.otp }}"
          export ZBEAM_REQUIRE_ALL_OTP=1
          zig build test-interop
