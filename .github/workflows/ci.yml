name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig src tests examples
      - run: zig build
      - run: zig build test-all
      - run: zig build test-all -Doptimize=safe
      - run: zig build test-labs
      - run: zig build test-labs -Doptimize=safe
      - run: sh scripts/test/build_args_smoke.sh
      - name: Verify explicit allocator comparators in both modes
        run: |
          for mode in debug safe; do
            zig build test-allocators -Doptimize="$mode"
            zig build test-allocators -Doptimize="$mode" -Dallocator=smp
            zig build test-allocators -Doptimize="$mode" -Dallocator=debug -Dlink-libc=true
            zig build test-allocators -Doptimize="$mode" -Dallocator=smp -Dlink-libc=true
            zig build test-allocators -Doptimize="$mode" -Dallocator=libc
          done
      - run: for script in scripts/interop/*.sh scripts/bench_port_vs_zbeam.sh; do sh -n "$script"; done

  snmalloc-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch the exact optional research dependency
        run: |
          git init /tmp/zbeam-snmalloc
          git -C /tmp/zbeam-snmalloc remote add origin https://github.com/microsoft/snmalloc.git
          git -C /tmp/zbeam-snmalloc fetch --depth=1 origin 526c55bdffa17aae20a9a3d24fe68a7a3b8d9894
          git -C /tmp/zbeam-snmalloc checkout --detach FETCH_HEAD
      - name: Rebuild and check both C ABI and resize controls
        run: |
          for hardening in normal checks; do
            object="/tmp/snmalloc-$hardening.o"
            sh scripts/bench/build_snmalloc.sh /tmp/zbeam-snmalloc "$object" "$hardening"
            for mode in debug safe; do
              for resize in false true; do
                zig build test-allocators -Doptimize="$mode" -Dallocator=snmalloc -Dsnmalloc-object="$object" -Dsnmalloc-resize="$resize"
              done
            done
          done

  otp-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["25", "26", "27"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - run: zig build
      - name: Verify OTP ${{ matrix.otp }} MVP contracts
        run: |
          export OTP_ERL_${{ matrix.otp }}="$(command -v erl)"
          export OTP_VERSIONS="${{ matrix.otp }}"
          export ZBEAM_REQUIRE_ALL_OTP=1
          zig build test-interop
