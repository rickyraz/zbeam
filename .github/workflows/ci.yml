name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check build.zig src tests examples
      - run: zig build
      - run: zig build test-all
      - run: zig build test-all -Doptimize=safe
      - run: zig build test-labs
      - run: zig build test-labs -Doptimize=safe
      - run: sh scripts/test/build_args_smoke.sh
      - run: for script in scripts/interop/*.sh scripts/bench_port_vs_zbeam.sh; do sh -n "$script"; done

  otp-interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["25", "26", "27"]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - run: zig build
      - name: Verify OTP ${{ matrix.otp }} MVP contracts
        run: |
          export OTP_ERL_${{ matrix.otp }}="$(command -v erl)"
          export OTP_VERSIONS="${{ matrix.otp }}"
          export ZBEAM_REQUIRE_ALL_OTP=1
          zig build test-interop

  native-comparison:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 2:2 +SDcpu 2 +SDio 1"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - run: zig build build-research test-research -Doptimize=safe
      - name: Verify normal and dirty NIFs with the same compiler
        run: |
          cd benchmarks/zigler
          export ZIG_EXECUTABLE_PATH="$(command -v zig)"
          export ZIGLER_STAGING_ROOT="$PWD/_build/zigler-017-stage"
          mkdir -p "$ZIGLER_STAGING_ROOT"
          mix deps.get
          mix test
